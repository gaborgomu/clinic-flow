    function findPathologyProfile(hypothesisLabel) {
      if (!hypothesisLabel) return null;
      const lower = hypothesisLabel.toLowerCase();
      return (
        PATHOLOGY_PROFILES.find((p) =>
          p.matchKeywords.some((kw) => lower.includes(kw.toLowerCase()))
        ) || null
      );
    }

    // ============================================================================
    function App() {
      const [assessments, setAssessments] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch {
          // ignore corrupted storage
        }
        return [createNewAssessment()];
      });

      const [currentId, setCurrentId] = useState(() => assessments[0]?.id);
      const [activeTab, setActiveTab] = useState('colloquio');
      const [darkMode, setDarkMode] = useState(false);
      const [archiveOpen, setArchiveOpen] = useState(false);
      const [archiveSearch, setArchiveSearch] = useState('');
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      const [redFlagExpanded, setRedFlagExpanded] = useState(false);
      const [selectedTestModal, setSelectedTestModal] = useState(null);
      const [selectedPathologyProfile, setSelectedPathologyProfile] = useState(null);
      const [districtPickerOpen, setDistrictPickerOpen] = useState(false);
      const [newDemandText, setNewDemandText] = useState('');
      const [toast, setToast] = useState(null);
      const fileInputRef = useRef(null);

      const current = useMemo(
        () => assessments.find((a) => a.id === currentId) || assessments[0],
        [assessments, currentId]
      );

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(assessments));
        } catch {
          // ignore quota error
        }
      }, [assessments]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2600);
      };

      const updateCurrent = (updater) => {
        setAssessments((prev) =>
          prev.map((a) => {
            if (a.id !== current.id) return a;
            const updated = typeof updater === 'function' ? updater(a) : updater;
            return { ...updated, updatedAt: new Date().toISOString() };
          })
        );
      };

      const updatePatientField = (field, value) => {
        updateCurrent((a) => ({
          ...a,
          patient: { ...a.patient, [field]: value },
        }));
      };

      const toggleGeneralRedFlag = (rfId) => {
        updateCurrent((a) => ({
          ...a,
          generalRedFlags: { ...a.generalRedFlags, [rfId]: !a.generalRedFlags[rfId] },
        }));
      };

      const toggleDistrictRedFlag = (key) => {
        updateCurrent((a) => ({
          ...a,
          districtRedFlags: { ...a.districtRedFlags, [key]: !a.districtRedFlags[key] },
        }));
      };

      const toggleActiveDistrict = (districtId) => {
        updateCurrent((a) => {
          const exists = a.activeDistricts.includes(districtId);
          const nextDistricts = exists
            ? a.activeDistricts.filter((id) => id !== districtId)
            : [...a.activeDistricts, districtId];
          const distObj = CLINICAL_DISTRICTS.find((d) => d.id === districtId);
          const nextPathways = { ...a.activePathways };
          if (!exists && distObj && !nextPathways[districtId]) {
            nextPathways[districtId] = distObj.pathways[0].id;
          }
          return {
            ...a,
            activeDistricts: nextDistricts,
            activePathways: nextPathways,
          };
        });
      };

      const setDistrictPathway = (districtId, pathwayId) => {
        updateCurrent((a) => ({
          ...a,
          activePathways: { ...a.activePathways, [districtId]: pathwayId },
        }));
      };

      const setTestResult = (testId, result) => {
        updateCurrent((a) => ({
          ...a,
          testResults: { ...a.testResults, [testId]: result },
        }));
      };

      const setStepNote = (stepKey, note) => {
        updateCurrent((a) => ({
          ...a,
          stepNotes: { ...a.stepNotes, [stepKey]: note },
        }));
      };

      const addFunctionalDemand = (text, priority = 'alta') => {
        const clean = text.trim();
        if (!clean) return;
        updateCurrent((a) => ({
          ...a,
          functionalChecklist: [
            ...(a.functionalChecklist || []),
            { id: `fd_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`, text: clean, done: false, priority },
          ],
        }));
      };

      const syncDemandsFromAnamnesis = () => {
        const existing = new Set((current.functionalChecklist || []).map((i) => i.text.toLowerCase()));
        const candidates = [];
        const splitItems = (str) =>
          (str || '')
            .split(/[\n,;•]+/)
            .map((s) => s.trim())
            .filter((s) => s.length > 2);

        splitItems(current.patient.goals).forEach((s) => candidates.push({ text: `Obiettivo: ${s}`, priority: 'alta' }));
        splitItems(current.patient.aggravating).forEach((s) =>
          candidates.push({ text: `Riprendere gesto: ${s}`, priority: 'media' })
        );

        const toAdd = candidates.filter((c) => !existing.has(c.text.toLowerCase()));
        if (toAdd.length === 0) {
          showToast('Nessuna nuova richiesta da estrarre dall’anamnesi.');
          return;
        }
        updateCurrent((a) => ({
          ...a,
          functionalChecklist: [
            ...(a.functionalChecklist || []),
            ...toAdd.map((item, idx) => ({
              id: `fd_${Date.now()}_${idx}`,
              text: item.text,
              done: false,
              priority: item.priority,
            })),
          ],
        }));
        showToast(`Aggiunte ${toAdd.length} richieste funzionali dall’anamnesi.`);
      };

      const toggleDemandDone = (id) => {
        updateCurrent((a) => ({
          ...a,
          functionalChecklist: (a.functionalChecklist || []).map((item) =>
            item.id === id ? { ...item, done: !item.done } : item
          ),
        }));
      };

      const removeDemand = (id) => {
        updateCurrent((a) => ({
          ...a,
          functionalChecklist: (a.functionalChecklist || []).filter((item) => item.id !== id),
        }));
      };

      const clinicalSummary = useMemo(() => {
        const redFlagsFound = [];
        const executedByDistrict = [];
        const highPriorityHypotheses = new Map();
        const clinicalHypotheses = new Map();

        GENERAL_RED_FLAGS.forEach((rf) => {
          if (current.generalRedFlags?.[rf.id]) {
            redFlagsFound.push(`Generale: ${rf.label}`);
          }
        });

        CLINICAL_DISTRICTS.forEach((dist) => {
          dist.redFlags.forEach((rfText, idx) => {
            if (current.districtRedFlags?.[`${dist.id}_${idx}`]) {
              redFlagsFound.push(`${dist.name}: ${rfText}`);
            }
          });

          const distExecutedSteps = [];
          dist.pathways.forEach((pw) => {
            pw.steps.forEach((step) => {
              const executedTests = step.tests
                .map((t) => ({ ...t, result: current.testResults?.[t.id] || null }))
                .filter((t) => t.result === 'pos' || t.result === 'neg');

              const noteKey = `${dist.id}_${pw.id}_${step.id}`;
              const note = (current.stepNotes?.[noteKey] || '').trim();

              if (executedTests.length > 0 || note) {
                distExecutedSteps.push({
                  pathwayLabel: pw.label,
                  stepId: step.id,
                  stepTitle: step.title,
                  tests: executedTests,
                  note,
                });
              }

              executedTests.forEach((t) => {
                if (t.result === 'pos') {
                  const isRF = Boolean(t.isRedFlag || step.isRedFlag);
                  const hyp = t.hypothesis || step.hypothesisPos;
                  if (isRF) {
                    redFlagsFound.push(`Test (+) ${dist.name} [${step.id}]: ${t.name}`);
                    if (hyp) {
                      highPriorityHypotheses.set(hyp, (highPriorityHypotheses.get(hyp) || 0) + 1);
                    }
                  } else if (hyp) {
                    clinicalHypotheses.set(hyp, (clinicalHypotheses.get(hyp) || 0) + 1);
                  }
                }
              });
            });
          });

          if (distExecutedSteps.length > 0) {
            executedByDistrict.push({
              districtId: dist.id,
              districtName: dist.name,
              steps: distExecutedSteps,
            });
          }
        });

        return {
          redFlagsFound,
          executedByDistrict,
          highPriorityHypotheses: Array.from(highPriorityHypotheses.entries()).map(([label, count]) => ({ label, count })),
          clinicalHypotheses: Array.from(clinicalHypotheses.entries()).map(([label, count]) => ({ label, count })),
        };
      }, [current]);

      const handleCreateNew = () => {
        const fresh = createNewAssessment();
        setAssessments((prev) => [fresh, ...prev]);
        setCurrentId(fresh.id);
        setActiveTab('colloquio');
        setArchiveOpen(false);
        showToast('Nuova scheda paziente creata.');
      };

      const handleDeleteAssessment = (id) => {
        setAssessments((prev) => {
          const remaining = prev.filter((a) => a.id !== id);
          if (remaining.length === 0) {
            const fresh = createNewAssessment();
            setCurrentId(fresh.id);
            return [fresh];
          }
          if (currentId === id) {
            setCurrentId(remaining[0].id);
          }
          return remaining;
        });
        setConfirmDeleteId(null);
        showToast('Scheda eliminata.');
      };

      const handleExportJSON = () => {
        try {
          const blob = new Blob([JSON.stringify(assessments, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `ClinicaFlow_Backup_${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          URL.revokeObjectURL(url);
          showToast('Backup JSON esportato.');
        } catch {
          showToast('Errore durante l’esportazione.');
        }
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('Formato non valido');
            setAssessments(parsed);
            setCurrentId(parsed[0].id);
            showToast(`Importate ${parsed.length} schede dal backup.`);
          } catch {
            showToast('File JSON non valido.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const buildFormattedReport = () => {
        const p = current.patient;
        const lines = [
          `=== CLINICAFLOW — REPORT DI VALUTAZIONE CLINICA ===`,
          `Paziente: ${p.name || 'Non specificato'} | Età: ${p.age || '-'} | Data: ${p.date || '-'}`,
          `Lato interessato: ${p.side || '-'} | NRS (Attuale/Picco/Riposo): ${p.nrsCurrent}/10 - ${p.nrsPeak}/10 - ${p.nrsRest}/10`,
          ``,
          `--- 1. COLLOQUIO CONOSCITIVO ---`,
          p.occupation ? `• Occupazione/Posture: ${p.occupation}` : null,
          p.sport ? `• Sport/Attività: ${p.sport}` : null,
          p.goals ? `• Obiettivi/Richieste: ${p.goals}` : null,
          p.location ? `• Sede/Irradiazione: ${p.location}` : null,
          p.onset ? `• Insorgenza/Durata: ${p.onset}` : null,
          p.behavior24h ? `• Andamento 24h: ${p.behavior24h}` : null,
          p.aggravating ? `• Fattori Aggravanti: ${p.aggravating}` : null,
          p.easing ? `• Fattori Allevianti: ${p.easing}` : null,
          p.systemic ? `• Patologie Sistemiche: ${p.systemic}` : null,
          p.traumaHistory ? `• Traumi/Chirurgia: ${p.traumaHistory}` : null,
          p.examsMeds ? `• Visite/Esami/Farmaci: ${p.examsMeds}` : null,
        ].filter(Boolean);

        if (clinicalSummary.redFlagsFound.length > 0) {
          lines.push(``, `!!! RED FLAGS RILEVATE (STOP & REFER) !!!`);
          clinicalSummary.redFlagsFound.forEach((rf) => lines.push(`  [!] ${rf}`));
        }

        lines.push(``, `--- 2. IPOTESI DIAGNOSTICHE EMERSE ---`);
        if (clinicalSummary.highPriorityHypotheses.length > 0) {
          lines.push(`* Alta Priorità / Red Flags:`);
          clinicalSummary.highPriorityHypotheses.forEach((h) => lines.push(`  - ${h.label} (${h.count} test +)`));
        }
        if (clinicalSummary.clinicalHypotheses.length > 0) {
          lines.push(`* Clinico-Funzionali:`);
          clinicalSummary.clinicalHypotheses.forEach((h) => lines.push(`  - ${h.label} (${h.count} test +)`));
        }
        if (
          clinicalSummary.highPriorityHypotheses.length === 0 &&
          clinicalSummary.clinicalHypotheses.length === 0
        ) {
          lines.push(`  Nessuna ipotesi automatica rilevata (nessun test positivo).`);
        }

        lines.push(``, `--- 3. TEST CLINICI ESEGUITI ---`);
        if (clinicalSummary.executedByDistrict.length === 0) {
          lines.push(`  Nessun test registrato.`);
        } else {
          clinicalSummary.executedByDistrict.forEach((d) => {
            lines.push(`[${d.districtName.toUpperCase()}]`);
            d.steps.forEach((s) => {
              lines.push(`  Step ${s.stepId} — ${s.stepTitle}:`);
              s.tests.forEach((t) => {
                lines.push(`    • ${t.name}: ${t.result === 'pos' ? 'POSITIVO (+)' : 'NEGATIVO (-)'}`);
              });
              if (s.note) lines.push(`    Note: ${s.note}`);
            });
          });
        }

        if ((current.functionalChecklist || []).length > 0) {
          lines.push(``, `--- 4. RICHIESTE FUNZIONALI IMMEDIATE ---`);
          current.functionalChecklist.forEach((item) => {
            lines.push(`  [${item.done ? 'X' : ' '}] ${item.text}`);
          });
        }

        const fp = current.finalPlan || {};
        if (fp.finalHypothesis || fp.objectives || fp.loadManagement) {
          lines.push(``, `--- 5. CONCLUSIONI E PIANO DI LAVORO ---`);
          if (fp.finalHypothesis) lines.push(`• Ipotesi Finale: ${fp.finalHypothesis}`);
          if (fp.objectives) lines.push(`• Obiettivi: ${fp.objectives}`);
          if (fp.loadManagement) lines.push(`• Piano / Gestione Carico: ${fp.loadManagement}`);
        }

        return lines.join('\n');
      };

      const handleCopyReport = () => {
        const text = buildFormattedReport();
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('Report copiato negli appunti!');
        } catch {
          showToast('Impossibile copiare il report.');
        }
      };

      const filteredAssessments = useMemo(() => {
        const q = archiveSearch.trim().toLowerCase();
        if (!q) return assessments;
        return assessments.filter((a) => {
          const nameMatch = (a.patient.name || '').toLowerCase().includes(q);
          const distMatch = (a.activeDistricts || []).some((id) => {
            const d = CLINICAL_DISTRICTS.find((x) => x.id === id);
            return d?.name.toLowerCase().includes(q);
          });
          return nameMatch || distMatch;
        });
      }, [assessments, archiveSearch]);

      const hasRedFlags = clinicalSummary.redFlagsFound.length > 0;

      return (
        <div className={darkMode ? 'dark' : ''}>
          <div className="min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 pb-24 transition-colors">
            <header className="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 no-print">
              <div className="max-w-3xl mx-auto px-3.5 py-2.5 flex items-center justify-between gap-2">
                <div className="flex items-center gap-2.5 min-w-0">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-teal-600 to-sky-700 text-white flex items-center justify-center shadow-sm shrink-0">
                    <Stethoscope className="w-5 h-5" />
                  </div>
                  <div className="min-w-0">
                    <h1 className="text-sm sm:text-base font-extrabold tracking-tight text-slate-900 dark:text-white truncate">
                      ClinicaFlow
                    </h1>
                    <p className="text-[11px] text-slate-500 dark:text-slate-400 truncate">
                      {current.patient.name ? current.patient.name : 'Nuova valutazione'} • {current.patient.side}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-1.5 shrink-0">
                  <button
                    type="button"
                    onClick={() => setDarkMode((v) => !v)}
                    className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700"
                    aria-label="Cambia tema"
                  >
                    {darkMode ? <Sun className="w-4 h-4" /> : <Moon className="w-4 h-4" />}
                  </button>
                  <button
                    type="button"
                    onClick={() => setArchiveOpen(true)}
                    className="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold shadow-sm active:scale-95 transition"
                  >
                    <Archive className="w-4 h-4" />
                    <span>Archivio</span>
                    <span className="px-1.5 py-0.5 rounded-md bg-white/20 text-[10px]">
                      {assessments.length}
                    </span>
                  </button>
                </div>
              </div>

              {hasRedFlags && (
                <div className="bg-rose-600 text-white border-t border-rose-500">
                  <div className="max-w-3xl mx-auto px-3.5 py-2">
                    <button
                      type="button"
                      onClick={() => setRedFlagExpanded((v) => !v)}
                      className="w-full flex items-center justify-between gap-2 text-left"
                    >
                      <div className="flex items-center gap-2 min-w-0">
                        <ShieldAlert className="w-5 h-5 shrink-0 animate-pulse" />
                        <span className="text-xs sm:text-sm font-extrabold tracking-wide truncate">
                          ATTENZIONE: RED FLAG RILEVATA ({clinicalSummary.redFlagsFound.length}) — STOP & REFER MEDICO
                        </span>
                      </div>
                      {redFlagExpanded ? (
                        <ChevronDown className="w-4 h-4 shrink-0" />
                      ) : (
                        <ChevronRight className="w-4 h-4 shrink-0" />
                      )}
                    </button>
                    {redFlagExpanded && (
                      <ul className="mt-2 pt-2 border-t border-rose-500/60 space-y-1 text-xs text-rose-50">
                        {clinicalSummary.redFlagsFound.map((rf, i) => (
                          <li key={i} className="flex items-start gap-1.5">
                            <span className="font-bold">•</span>
                            <span>{rf}</span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                </div>
              )}
            </header>

            <main className="max-w-3xl mx-auto px-3.5 pt-4 space-y-4">
              {activeTab === 'colloquio' && (
                <div className="space-y-4">
                  <section className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3.5">
                    <div className="flex items-center justify-between">
                      <h2 className="text-sm font-extrabold uppercase tracking-wider text-teal-700 dark:text-teal-400 flex items-center gap-2">
                        <User className="w-4 h-4" /> Profilo Paziente
                      </h2>
                      <button
                        type="button"
                        onClick={handleCreateNew}
                        className="text-xs font-bold text-sky-700 dark:text-sky-400 flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-sky-50 dark:bg-sky-950/40"
                      >
                        <Plus className="w-3.5 h-3.5" /> Nuova
                      </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="sm:col-span-2">
                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">
                          Nome / Codice Paziente
                        </label>
                        <input
                          type="text"
                          value={current.patient.name}
                          onChange={(e) => updatePatientField('name', e.target.value)}
                          placeholder="Es. Mario Rossi / PZ-042"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                        />
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">
                            Età
                          </label>
                          <input
                            type="number"
                            inputMode="numeric"
                            value={current.patient.age}
                            onChange={(e) => updatePatientField('age', e.target.value)}
                            placeholder="AA"
                            className="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">
                            Data
                          </label>
                          <input
                            type="date"
                            value={current.patient.date}
                            onChange={(e) => updatePatientField('date', e.target.value)}
                            className="w-full px-2 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs focus:outline-none focus:ring-2 focus:ring-teal-500"
                          />
                        </div>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">
                        Lato interessato
                      </label>
                      <div className="grid grid-cols-4 gap-1.5">
                        {SIDES.map((s) => (
                          <button
                            key={s}
                            type="button"
                            onClick={() => updatePatientField('side', s)}
                            className={`py-2.5 px-2 rounded-xl text-xs font-bold transition border ${
                              current.patient.side === s
                                ? 'bg-teal-600 text-white border-teal-600 shadow-sm'
                                : 'bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700'
                            }`}
                          >
                            {s}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="space-y-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">
                          Occupazione, posture e carichi
                        </label>
                        <textarea
                          rows={2}
                          value={current.patient.occupation}
                          onChange={(e) => updatePatientField('occupation', e.target.value)}
                          placeholder="Lavoro principale, posture mantenute, gesti ripetitivi..."
                          className="w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">
                          Sport e attività fisica
                        </label>
                        <input
                          type="text"
                          value={current.patient.sport}
                          onChange={(e) => updatePatientField('sport', e.target.value)}
                          placeholder="Discipline, frequenza, variazioni recenti di carico..."
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-teal-700 dark:text-teal-400 mb-1">
                          Obiettivi e richieste funzionali immediate
                        </label>
                        <textarea
                          rows={2}
                          value={current.patient.goals}
                          onChange={(e) => updatePatientField('goals', e.target.value)}
                          placeholder="Cosa vuole tornare a fare subito senza dolore? (separa con virgole per la checklist)"
                          className="w-full px-3.5 py-2 rounded-xl bg-teal-50/40 dark:bg-teal-950/20 border border-teal-200 dark:border-teal-800 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                        />
                      </div>
                    </div>
                  </section>

                  <section className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-4">
                    <h2 className="text-sm font-extrabold uppercase tracking-wider text-sky-700 dark:text-sky-400 flex items-center gap-2">
                      <Activity className="w-4 h-4" /> Comportamento del Dolore (NRS 0–10)
                    </h2>

                  </div>

                  <section className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3">
                    <h2 className="text-sm font-extrabold uppercase tracking-wider text-teal-700 dark:text-teal-400 flex items-center gap-2">
                      <Sparkles className="w-4 h-4" /> Ipotesi Diagnostiche Automatiche
                    </h2>

                    {clinicalSummary.highPriorityHypotheses.length > 0 && (
                      <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-800 space-y-2">
                        <p className="text-xs font-extrabold uppercase text-rose-700 dark:text-rose-400 flex items-center gap-1.5">
                          <ShieldAlert className="w-4 h-4" /> Alta Priorità / Red Flags
                        </p>
                        {clinicalSummary.highPriorityHypotheses.map((h) => {
                          const profile = findPathologyProfile(h.label);
                          return (
                            <div
                              key={h.label}
                              className="flex items-center justify-between gap-2 text-xs sm:text-sm font-bold text-rose-900 dark:text-rose-200"
                            >
                              <button
                                type="button"
                                disabled={!profile}
                                onClick={() => profile && setSelectedPathologyProfile(profile)}
                                className={`text-left flex items-center gap-1.5 min-w-0 ${
                                  profile ? 'hover:underline cursor-pointer' : 'cursor-default'
                                }`}
                              >
                                <span className="truncate">• {h.label}</span>
                                {profile && (
                                  <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-rose-200/80 dark:bg-rose-900 text-rose-800 dark:text-rose-200 text-[10px] font-extrabold shrink-0 no-print">
                                    <BookOpen className="w-3 h-3" /> Scheda EBM
                                  </span>
                                )}
                              </button>
                              <span className="px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] shrink-0">
                                {h.count} test (+)
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {clinicalSummary.clinicalHypotheses.length > 0 ? (
                      <div className="p-3 rounded-xl bg-teal-50/70 dark:bg-teal-950/25 border border-teal-200 dark:border-teal-800 space-y-2">
                        <p className="text-xs font-extrabold uppercase text-teal-800 dark:text-teal-300">
                          Ipotesi Clinico-Funzionali
                        </p>
                        {clinicalSummary.clinicalHypotheses.map((h) => {
                          const profile = findPathologyProfile(h.label);
                          return (
                            <div
                              key={h.label}
                              className="flex items-center justify-between gap-2 text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-100"
                            >
                              <button
                                type="button"
                                disabled={!profile}
                                onClick={() => profile && setSelectedPathologyProfile(profile)}
                                className={`text-left flex items-center gap-1.5 min-w-0 ${
                                  profile ? 'hover:text-teal-700 dark:hover:text-teal-300 cursor-pointer' : 'cursor-default'
                                }`}
                              >
                                <span className="truncate">• {h.label}</span>
                                {profile && (
                                  <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-md bg-teal-200/80 dark:bg-teal-900 text-teal-900 dark:text-teal-200 text-[10px] font-extrabold shrink-0 no-print">
                                    <BookOpen className="w-3 h-3" /> Scheda EBM
                                  </span>
                                )}
                              </button>
                              <span className="px-2 py-0.5 rounded-full bg-teal-600 text-white text-[10px] shrink-0">
                                {h.count} test (+)
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    ) : (
                      clinicalSummary.highPriorityHypotheses.length === 0 && (
                        <p className="text-xs text-slate-500 dark:text-slate-400 italic">
                          Segna almeno un test come Positivo (+) nella scheda Valutazione per generare automaticamente le ipotesi diagnostiche.
                        </p>
                      )
                    )}
                  </section>

                  <section className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3">
                    <div className="flex items-center justify-between gap-2">
                      <h2 className="text-sm font-extrabold uppercase tracking-wider text-sky-700 dark:text-sky-400 flex items-center gap-2">
                        <Target className="w-4 h-4" /> Richieste Funzionali Immediate
                      </h2>
                      <button
                        type="button"
                        onClick={syncDemandsFromAnamnesis}
                        className="no-print px-2.5 py-1.5 rounded-lg bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 text-[11px] font-bold border border-sky-200 dark:border-sky-800"
                      >
                        + Estrai da Anamnesi
                      </button>
                    </div>

                    <div className="flex gap-2 no-print">
                      <input
                        type="text"
                        value={newDemandText}
                        onChange={(e) => setNewDemandText(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') {
                            addFunctionalDemand(newDemandText);
                            setNewDemandText('');
                          }
                        }}
                        placeholder="Es. Dormire sul fianco, sollevare 5 kg, correre 20 min..."
                        className="flex-1 px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                      <button
                        type="button"
                        onClick={() => {
                          addFunctionalDemand(newDemandText);
                          setNewDemandText('');
                        }}
                        className="px-3.5 py-2 rounded-xl bg-teal-600 text-white font-bold text-xs shrink-0"
                      >
                        Aggiungi
                      </button>
                    </div>

                    <div className="space-y-1.5">
                      {(current.functionalChecklist || []).length === 0 ? (
                        <p className="text-xs text-slate-500 dark:text-slate-400 italic">
                          Usa “+ Estrai da Anamnesi” o aggiungi manualmente i gesti prioritari da recuperare.
                        </p>
                      ) : (
                        current.functionalChecklist.map((item) => (
                          <div
                            key={item.id}
                            className={`flex items-center justify-between gap-2 p-2.5 rounded-xl border ${
                              item.done
                                ? 'bg-emerald-50/70 dark:bg-emerald-950/20 border-emerald-200 dark:border-emerald-900'
                                : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700'
                            }`}
                          >
                            <label className="flex items-center gap-2.5 flex-1 cursor-pointer min-w-0">
                              <input
                                type="checkbox"
                                checked={item.done}
                                onChange={() => toggleDemandDone(item.id)}
                                className="w-4 h-4 accent-teal-600 shrink-0"
                              />
                              <span
                                className={`text-xs sm:text-sm font-medium ${
                                  item.done ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100'
                                }`}
                              >
                                {item.text}
                              </span>
                            </label>
                            <button
                              type="button"
                              onClick={() => removeDemand(item.id)}
                              className="no-print p-1.5 text-slate-400 hover:text-rose-600"
                              aria-label="Elimina richiesta"
                            >
                              <Trash2 className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        ))
                      )}
                    </div>
                  </section>

                  <section className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3">
                    <h2 className="text-sm font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-300 flex items-center gap-2">
                      <ClipboardCheck className="w-4 h-4 text-teal-600" /> Test Eseguiti (Positivi / Negativi)
                    </h2>
                    {clinicalSummary.executedByDistrict.length === 0 ? (
                      <p className="text-xs text-slate-500 dark:text-slate-400 italic">
                        Nessun test ancora compilato. I test lasciati su “N/E” vengono nascosti automaticamente.
                      </p>
                    ) : (
                      <div className="space-y-3">
                        {clinicalSummary.executedByDistrict.map((d) => (
                          <div key={d.districtId} className="space-y-2">
                            <h3 className="text-xs font-extrabold uppercase tracking-wider text-teal-700 dark:text-teal-400 border-b border-slate-200 dark:border-slate-800 pb-1">
                              {d.districtName}
                            </h3>
                            {d.steps.map((s) => (
                              <div
                                key={`${d.districtId}_${s.stepId}`}
                                className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200/70 dark:border-slate-700/70 space-y-1"
                              >
                                <p className="text-xs font-bold text-slate-700 dark:text-slate-200">
                                  {s.stepId} — {s.stepTitle}
                                </p>
                                {s.tests.map((t) => (
                                  <div key={t.id} className="flex items-center justify-between gap-2 text-xs">
                                    <span className="text-slate-600 dark:text-slate-300">• {t.name}</span>
                                    <span
                                      className={`px-2 py-0.5 rounded-md font-extrabold text-[10px] shrink-0 ${
                                        t.result === 'pos'
                                          ? 'bg-rose-100 text-rose-700 dark:bg-rose-900/50 dark:text-rose-300'
                                          : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300'
                                      }`}
                                    >
                                      {t.result === 'pos' ? 'POS (+)' : 'NEG (-)'}
                                    </span>
                                  </div>
                                ))}
                                {s.note && (
                                  <p className="text-[11px] text-slate-500 dark:text-slate-400 italic pt-1">
                                    Note: {s.note}
                                  </p>
                                )}
                              </div>
                            ))}
                          </div>
                        ))}
                      </div>
                    )}
                  </section>

                  <section className="rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 shadow-sm space-y-3">
                    <h2 className="text-sm font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-300 flex items-center gap-2">
                      <CheckCircle2 className="w-4 h-4 text-teal-600" /> Piano di Lavoro & Gestione del Carico
                    </h2>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">
                        Ipotesi Clinica Finale
                      </label>
                      <textarea
                        rows={2}
                        value={current.finalPlan?.finalHypothesis || ''}
                        onChange={(e) =>
                          updateCurrent((a) => ({
                            ...a,
                            finalPlan: { ...a.finalPlan, finalHypothesis: e.target.value },
                          }))
                        }
                        placeholder="Sintesi diagnostica / inquadramento funzionale..."
                        className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">
                        Obiettivi a Breve / Medio Termine
                      </label>
                      <textarea
                        rows={2}
                        value={current.finalPlan?.objectives || ''}
                        onChange={(e) =>
                          updateCurrent((a) => ({
                            ...a,
                            finalPlan: { ...a.finalPlan, objectives: e.target.value },
                          }))
                        }
                        placeholder="Riduzione dolore, recupero ROM, tolleranza al carico..."
                        className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1">
                        Piano Terapeutico & Gestione del Carico
                      </label>
                      <textarea
                        rows={3}
                        value={current.finalPlan?.loadManagement || ''}
                        onChange={(e) =>
                          updateCurrent((a) => ({
                            ...a,
                            finalPlan: { ...a.finalPlan, loadManagement: e.target.value },
                          }))
                        }
                        placeholder="Esercizio terapeutico, terapia manuale, educazione, progressione carichi..."
                        className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                    </div>
                  </section>
                </div>
              )}
            </main>

            <nav className="fixed bottom-0 inset-x-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 no-print">
              <div className="max-w-3xl mx-auto grid grid-cols-3 p-1.5 gap-1">
                {[
                  { id: 'colloquio', label: '0. Colloquio', icon: User },
                  { id: 'valutazione', label: '1. Test Distretti', icon: ClipboardList },
                  { id: 'riepilogo', label: '2. Riepilogo', icon: ClipboardCheck },
                ].map(({ id, label, icon: IconComp }) => {
                  const active = activeTab === id;
                  return (
                    <button
                      key={id}
                      type="button"
                      onClick={() => setActiveTab(id)}
                      className={`flex flex-col items-center justify-center py-2 px-1 rounded-xl transition ${
                        active
                          ? 'bg-teal-600 text-white shadow-sm'
                          : 'text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                      }`}
                    >
                      <IconComp className="w-5 h-5 mb-0.5" />
                      <span className="text-[11px] font-bold">{label}</span>
                    </button>
                  );
                })}
              </div>
            </nav>

            <TestGuideModal
              modalData={selectedTestModal}
              currentValue={selectedTestModal ? current.testResults?.[selectedTestModal.test.id] || null : null}
              onSetResult={setTestResult}
              onClose={() => setSelectedTestModal(null)}
            />

            <PathologyDetailModal
              profile={selectedPathologyProfile}
              onClose={() => setSelectedPathologyProfile(null)}
            />

            {archiveOpen && (
              <div
                className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/60 backdrop-blur-sm p-0 sm:p-4"
                onClick={() => setArchiveOpen(false)}
              >
                <div
                  className="w-full sm:max-w-lg max-h-[88vh] flex flex-col bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden"
                  onClick={(e) => e.stopPropagation()}
                >
                  <div className="px-4 py-3.5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <h3 className="text-base font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                      <Archive className="w-5 h-5 text-teal-600" /> Archivio Schede Paziente
                    </h3>
                    <button
                      type="button"
                      onClick={() => setArchiveOpen(false)}
                      className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
                    >
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="p-3.5 space-y-3 border-b border-slate-200 dark:border-slate-800">
                    <div className="relative">
                      <Search className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                      <input
                        type="text"
                        value={archiveSearch}
                        onChange={(e) => setArchiveSearch(e.target.value)}
                        placeholder="Cerca per nome, codice o distretto..."
                        className="w-full pl-9 pr-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500"
                      />
                    </div>

                    <div className="grid grid-cols-3 gap-2">
                      <button
                        type="button"
                        onClick={handleCreateNew}
                        className="py-2 px-2 rounded-xl bg-teal-600 text-white text-xs font-bold flex items-center justify-center gap-1"
                      >
                        <Plus className="w-3.5 h-3.5" /> Nuova
                      </button>
                      <button
                        type="button"
                        onClick={handleExportJSON}
                        className="py-2 px-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold flex items-center justify-center gap-1 border border-slate-200 dark:border-slate-700"
                      >
                        <Download className="w-3.5 h-3.5" /> Esporta
                      </button>
                      <button
                        type="button"
                        onClick={() => fileInputRef.current?.click()}
                        className="py-2 px-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold flex items-center justify-center gap-1 border border-slate-200 dark:border-slate-700"
                      >
                        <Upload className="w-3.5 h-3.5" /> Importa
                      </button>
                      <input
                        ref={fileInputRef}
                        type="file"
                        accept="application/json"
                        onChange={handleImportJSON}
                        className="hidden"
                      />
                    </div>
                  </div>

                  <div className="overflow-y-auto p-3.5 space-y-2 flex-1">
                    {filteredAssessments.map((a) => {
                      const isCurrent = a.id === current.id;
                      const distNames = (a.activeDistricts || [])
                        .map((id) => CLINICAL_DISTRICTS.find((d) => d.id === id)?.name)
                        .filter(Boolean)
                        .join(', ');

                      return (
                        <div
                          key={a.id}
                          className={`p-3 rounded-2xl border transition ${
                            isCurrent
                              ? 'bg-teal-50/70 dark:bg-teal-950/30 border-teal-500'
                              : 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700'
                          }`}
                        >
                          <div className="flex items-start justify-between gap-2">
                            <button
                              type="button"
                              onClick={() => {
                                setCurrentId(a.id);
                                setArchiveOpen(false);
                              }}
                              className="text-left flex-1 min-w-0"
                            >
                              <p className="text-sm font-bold text-slate-900 dark:text-white truncate">
                                {a.patient.name || 'Paziente senza nome'}
                              </p>
                              <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 truncate">
                                {a.patient.date || '-'} • {distNames || 'Nessun distretto'}
                              </p>
                            </button>

                            {confirmDeleteId === a.id ? (
                              <div className="flex items-center gap-1 shrink-0">
                                <button
                                  type="button"
                                  onClick={() => handleDeleteAssessment(a.id)}
                                  className="px-2 py-1 rounded-lg bg-rose-600 text-white text-[11px] font-bold"
                                >
                                  Elimina
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setConfirmDeleteId(null)}
                                  className="px-2 py-1 rounded-lg bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-[11px] font-bold"
                                >
                                  Annulla
                                </button>
                              </div>
                            ) : (
                              <button
                                type="button"
                                onClick={() => setConfirmDeleteId(a.id)}
                                className="p-2 text-slate-400 hover:text-rose-600 shrink-0"
                                aria-label="Elimina scheda"
                              >
                                <Trash2 className="w-4 h-4" />
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {toast && (
              <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-bold shadow-lg flex items-center gap-2 no-print">
                <Save className="w-3.5 h-3.5 text-teal-400 dark:text-teal-600" />
                <span>{toast}</span>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
